# BusMate Dataset Processing Configuration

# Data Processing Settings
processing:
  batch_size: 1000
  max_workers: 4
  timeout: 300
  retry_attempts: 3
  
# File Paths
paths:
  raw_data: "raw-data/"
  staging: "staging/"
  processed_data: "processed-data/"
  exports: "exports/"
  logs: "logs/"
  
# Data Quality Settings
quality:
  min_route_stops: 2
  max_route_stops: 100
  duplicate_threshold: 0.95
  validation_rules:
    - route_number_required
    - stop_name_minimum_length
    - fare_positive_value
    
# Export Settings
exports:
  mobile_app:
    format: "json"
    compression: true
    max_file_size: "10MB"
  web_frontend:
    format: "json"
    include_metadata: true
  location_service:
    format: "csv"
    coordinate_precision: 6
  route_service:
    format: "json"
    include_schedules: false
    
# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  rotate_logs: true
  max_log_size: "50MB"
  backup_count: 5
  
# Data Source Configurations
sources:
  ntc_pdf:
    enabled: true
    auto_process: true
    backup_originals: true
  manual_inputs:
    validation_required: true
    approval_needed: true
  api_dumps:
    enabled: false
    refresh_interval: "24h"
    
# Processing Pipeline Settings
pipeline:
  stages:
    extraction:
      pdf_dpi: 300
      ocr_enabled: false
    cleaning:
      remove_duplicates: true
      normalize_text: true
      fix_encoding: true
    structuring:
      output_format: "csv"
      include_validation: true
    validation:
      strict_mode: false
      auto_fix_minor: true
    enrichment:
      geocoding_enabled: false
      fare_calculation: true