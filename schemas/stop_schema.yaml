# stops.csv structure definition for BusMate Route Service
# UUID will be generated automatically during import

csv_structure:
  file_name: "stops.csv"
  description: "Stops dataset for BusMate Route Service import"
  columns:
    - name: "name"
      type: "string"
      required: true
      description: "Name of the stop"
      max_length: 255

    - name: "description"
      type: "string"
      required: false
      description: "Optional description of the stop"
      max_length: 1000

    - name: "latitude"
      type: "double"
      required: false
      description: "Latitude coordinate of the stop location"
      precision: 15
      decimal_places: 10

    - name: "longitude"
      type: "double"
      required: false
      description: "Longitude coordinate of the stop location"
      precision: 15
      decimal_places: 10

    - name: "address"
      type: "string"
      required: false
      description: "Street address of the stop"
      max_length: 500

    - name: "city"
      type: "string"
      required: false
      description: "City where the stop is located"
      max_length: 100

    - name: "state"
      type: "string"
      required: false
      description: "State/province where the stop is located"
      max_length: 100

    - name: "zip_code"
      type: "string"
      required: false
      description: "Postal/ZIP code of the stop location"
      max_length: 20

    - name: "country"
      type: "string"
      required: false
      description: "Country where the stop is located"
      max_length: 100

    - name: "is_accessible"
      type: "boolean"
      required: false
      description: "Whether the stop is wheelchair accessible"
      default: false

import_config:
  id_generation: "auto"
  timestamp_generation: "auto"
  required_fields:
    - "name"
  validation_rules:
    latitude:
      min: -90
      max: 90
    longitude:
      min: -180
      max: 180

example_row:
  name: "Fort Central Bus Stand"
  description: "Main bus stand in the city center"
  latitude: 40.7127281
  longitude: -74.0060152
  address: "123 Main Street"
  city: "Colombo"
  state: "Western Province"
  zip_code: "10001"
  country: "Sri Lanka"
  is_accessible: true